spring:
  application:
    name: company-profile-query
  datasource:
    url: jdbc:h2:file:./data/company_profile;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  address: 127.0.0.1
  port: 8080
  error:
    include-message: always

company-browser:
  enabled: true
  headless: false
  timeout-millis: 15000
  max-task-seconds: 180
  user-data-dir: .browser-data/company-profile
  screenshot-dir: .screenshots/company-profile

employment-jobs:
  storage-dir: data/employment-jobs
  retention-days: 30
  max-file-size-bytes: 20971520
  max-employment-rows: 10000
