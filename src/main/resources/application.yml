spring:
  application:
    name: equity-query
  datasource:
    url: jdbc:h2:mem:equity_query;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
  error:
    include-message: always
    include-stacktrace: always

# 企查查数据源配置（可选）
# 申请地址：https://open.qichacha.com/
qichacha:
  enabled: false
  app-key:
  app-secret:
