<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>企业信息补全</title>
  <style>
    :root{--blue:#155eef;--green:#15803d;--red:#b42318;--ink:#172033;--muted:#667085;--line:#d9e1ec;--soft:#f6f8fb}
    *{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:var(--ink);font:14px/1.55 "Microsoft YaHei",Arial,sans-serif}main{max-width:1180px;margin:auto;padding:28px 18px 60px}h1{margin:0 0 8px}h2{font-size:20px}.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;margin:18px 0;box-shadow:0 2px 10px #1720330a}.primary{border-top:4px solid var(--blue)}.muted{color:var(--muted)}.upload{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px;background:var(--soft);border:1px dashed #a9b8cc;border-radius:8px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}label{display:block;margin-bottom:5px;font-weight:600}input,textarea{width:100%;padding:10px;border:1px solid #b8c4d4;border-radius:6px}textarea{min-height:260px;resize:vertical}input[type=file]{width:auto}button{padding:9px 15px;border:0;border-radius:6px;background:var(--blue);color:#fff;cursor:pointer;font-weight:600}button.secondary{background:#64748b}button.success{background:var(--green)}button:disabled{opacity:.55;cursor:not-allowed}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.hidden{display:none!important}.notice{color:#175cd3;background:#eff8ff;border:1px solid #b2ddff;border-radius:7px;padding:10px;margin:10px 0}.errorbox{color:var(--red);background:#fff1f0;border:1px solid #f3b5b0;border-radius:7px;padding:10px;margin:10px 0}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.card{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:12px}.card strong{display:block;font-size:22px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:8px;margin-top:15px}table{width:100%;border-collapse:collapse;min-width:850px}th,td{padding:9px;border-bottom:1px solid var(--line);text-align:left}th{background:#f1f5f9}.candidate{border:1px solid var(--line);border-radius:7px;padding:10px;margin:8px 0}.record{display:grid;grid-template-columns:minmax(130px,220px) 1fr;gap:4px 12px;margin-top:8px;padding:8px;background:var(--soft);border-radius:6px}.record-key{font-weight:600;color:var(--muted)}@media(max-width:800px){.grid{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body><main>
  <h1>企业信息补全</h1>
  <p class="muted">可导入企业名单，也可以直接输入一个企业名称。无论哪种方式，都使用下面唯一的“官网信息全文”解析框。</p>

  <section class="panel primary">
    <h2>一、创建企业任务（任选一种）</h2>
    <div class="upload"><input id="listFile" type="file" accept=".csv,.xlsx"><button onclick="createFromFile()">导入企业名单</button><span class="muted">支持 CSV/XLSX，按企业名称去重</span></div>
    <div class="grid" style="margin-top:12px"><div><label for="manualName">不导入表单时，直接输入企业名称</label><input id="manualName" placeholder="例如：北京示例科技有限公司"></div><div class="actions" style="align-items:end"><button onclick="createManual()">开始单企业查询</button></div></div>
    <div id="createMessage" class="muted"></div>
  </section>

  <section id="taskPanel" class="panel hidden">
    <h2>二、企业结果表</h2><div id="cards" class="cards"></div>
    <div class="actions"><button class="secondary" onclick="refreshTask()">刷新</button><button class="success" onclick="downloadResult()">导出结果表</button></div>
    <div id="taskMessage"></div><div class="table-wrap"><table><thead><tr><th>原始企业名称</th><th>状态</th><th>工商登记全称</th><th>统一社会信用代码</th><th>法定代表人</th><th>经营状态</th><th>操作</th></tr></thead><tbody id="companyRows"></tbody></table></div>
  </section>

  <section id="editor" class="panel hidden">
    <h2>三、当前企业信息解析</h2><div id="currentCompany" class="notice"></div>
    <div class="actions"><button class="secondary" onclick="copyCompanyName()">复制企业名称</button><button class="secondary" onclick="window.open('https://www.gsxt.gov.cn/index.html','_blank','noopener')">打开国家企业信用信息公示系统</button><button class="secondary" onclick="nextCompany()">下一家</button></div>
    <label for="allText">官网信息全文（只保留这一个解析框）</label>
    <textarea id="allText" placeholder="将官网复制出的全部企业信息一次性粘贴到这里，系统会自动识别所有栏目"></textarea>
    <div class="actions"><button onclick="previewAll()">解析全部信息</button><button class="success" onclick="confirmAll()">确认并保存全部信息</button></div>
    <div id="preview"></div>
  </section>
</main>
<script>
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let jobId=null,companies=[],selected=null;
async function api(url,opt={}){const r=await fetch(url,opt),t=await r.text();let d={};try{d=t?JSON.parse(t):{}}catch(_){d={message:t}}if(!r.ok)throw Error(d.message||d.error||`请求失败 HTTP ${r.status}`);return d}
async function createFromFile(){const file=$("listFile").files[0];if(!file){$("createMessage").textContent="请选择 CSV 或 XLSX 文件";return}try{const fd=new FormData();fd.append("file",file);const d=await api("/api/company-batches",{method:"POST",body:fd});jobId=d.jobId;await showTask()}catch(e){$("createMessage").textContent="创建失败："+e.message}}
async function createManual(){const name=$("manualName").value.trim();if(!name){$("createMessage").textContent="请输入企业名称";return}try{const d=await api("/api/company-batches/manual",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({companyName:name})});jobId=d.jobId;await showTask()}catch(e){$("createMessage").textContent="创建失败："+e.message}}
async function showTask(){$("taskPanel").classList.remove("hidden");await refreshTask();$("taskPanel").scrollIntoView({behavior:"smooth"})}
async function refreshTask(){if(!jobId)return;try{const [s,list]=await Promise.all([api(`/api/company-batches/${jobId}`),api(`/api/company-batches/${jobId}/companies`)]);companies=list;$("cards").innerHTML=[["企业数",s.totalCompanies],["缓存命中",s.cacheHits],["待采集",s.pendingCollection],["待审核",s.pendingReview],["已完成",s.resolved]].map(x=>`<div class="card"><span>${x[0]}</span><strong>${x[1]}</strong></div>`).join("");$("companyRows").innerHTML=list.map(x=>`<tr><td>${esc(x.inputCompanyName)}</td><td>${esc(x.status)}</td><td>${esc(x.profile?.companyName)}</td><td>${esc(x.profile?.creditCode)}</td><td>${esc(x.profile?.legalPerson)}</td><td>${esc(x.profile?.registrationStatus)}</td><td><button onclick="openCompany(${x.companyId})">处理</button></td></tr>`).join("");if(!selected)nextCompany()}catch(e){$("taskMessage").innerHTML=`<div class="errorbox">刷新失败：${esc(e.message)}</div>`}}
function openCompany(id){selected=companies.find(x=>x.companyId===id);if(!selected)return;$("editor").classList.remove("hidden");$("currentCompany").textContent=`当前企业：${selected.inputCompanyName}（${selected.status}）`;$('allText').value="";$('preview').innerHTML="";$('editor').scrollIntoView({behavior:"smooth"})}
function nextCompany(){const next=companies.find(x=>x.status!=="RESOLVED");if(next)openCompany(next.companyId)}
async function copyCompanyName(){if(selected)await navigator.clipboard.writeText(selected.inputCompanyName)}
async function previewAll(){if(!selected)return;try{const d=await api(`/api/company-batches/${jobId}/companies/${selected.companyId}/all-sections/preview`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({pageText:$('allText').value})});renderPreview(d)}catch(e){$('preview').innerHTML=`<div class="errorbox">解析失败：${esc(e.message)}</div>`}}
async function confirmAll(){if(!selected)return;try{const d=await api(`/api/company-batches/${jobId}/companies/${selected.companyId}/all-sections/confirm`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({pageText:$('allText').value})});renderPreview(d);selected=null;await refreshTask()}catch(e){$('preview').innerHTML=`<div class="errorbox">保存失败：${esc(e.message)}</div>`}}
function renderPreview(d){const labels={BASIC:"企业基本信息",SHAREHOLDERS:"股东及出资",INVESTMENTS:"对外投资",POSITIONS:"任职信息",ABNORMAL:"经营异常",SERIOUS_VIOLATIONS:"严重违法失信"},fields={companyName:"企业名称",creditCode:"统一社会信用代码",legalPerson:"法定代表人",registrationStatus:"经营状态",entityType:"企业类型",registeredCapital:"注册资本",establishedAt:"成立日期",registrationAuthority:"登记机关",registeredAddress:"注册地址",businessScope:"经营范围",industry:"所属行业",rawText:"未结构化原文"};$('preview').innerHTML=Object.entries(d.sections||{}).map(([k,v])=>`<div class="candidate"><b>${labels[k]||k}</b>：${esc(v.status)}，识别 ${v.records?.length||0} 条${(v.records||[]).map(record=>`<div class="record">${Object.entries(record).map(([key,value])=>`<span class="record-key">${esc(fields[key]||key)}</span><span>${esc(value)}</span>`).join("")}</div>`).join("")}</div>`).join("")}
function downloadResult(){if(jobId)location.href=`/api/company-batches/${jobId}/export`}
</script></body></html>
